name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate or release (must match pyproject.toml)
        required: true
        type: string
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src/endstone_utp

  wheel:
    name: Universal wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel
        shell: python
        run: |
          from email.parser import Parser
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          wheel = wheels[0]
          assert wheel.name.endswith("-none-any.whl"), wheel.name

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "endstone_utp/__init__.py" in names, sorted(names)

              metadata_files = [name for name in names if name.endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1, metadata_files
              metadata = Parser().parsestr(archive.read(metadata_files[0]).decode("utf-8"))
              assert metadata["Name"] == project["name"], metadata["Name"]
              assert metadata["Version"] == project["version"], metadata["Version"]
              assert set(metadata["Requires-Python"].split(",")) == {">=3.11", "<3.16"}, metadata["Requires-Python"]

              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, entry_points
              text = archive.read(entry_points[0]).decode("utf-8")
              assert "[endstone]" in text, text
              assert "utp = endstone_utp:Main" in text, text

          print(wheel)

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error


  release:
    name: Publish validated GitHub Release
    needs: wheel
    if: >-
      (github.event_name == 'push' && (github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'chore: release v'))) ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_utp-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true
      - name: Validate release identity and wheel
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: python
        run: |
          import configparser
          import email.parser
          import os
          from pathlib import Path
          import subprocess
          import tomllib
          import zipfile
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          tag = 'v' + version
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['GITHUB_SHA'], (sha, os.environ['GITHUB_SHA'])
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              if os.environ['GITHUB_REF_TYPE'] == 'tag':
                  assert os.environ['GITHUB_REF_NAME'] == tag
              else:
                  assert os.environ['GITHUB_REF'] == 'refs/heads/master'
                  subject = subprocess.check_output(['git', 'log', '-1', '--pretty=%s'], text=True).strip()
                  assert subject == 'chore: release ' + tag, subject
          else:
              assert os.environ['GITHUB_REF'] == 'refs/heads/master'
              assert os.environ['INPUT_VERSION'] == version
          notes = Path('docs/releases') / (version + '.md')
          assert notes.is_file() and notes.read_text().strip()
          wheels = list(Path('artifacts').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert wheel.testzip() is None
              names = wheel.namelist()
              meta, = [n for n in names if n.endswith('.dist-info/METADATA')]
              m = email.parser.Parser().parsestr(wheel.read(meta).decode())
              assert m['Name'] == project['name']
              assert m['Version'] == version
              ep, = [n for n in names if n.endswith('.dist-info/entry_points.txt')]
              config = configparser.ConfigParser()
              config.read_string(wheel.read(ep).decode())
              assert dict(config['endstone']) == project['entry-points']['endstone']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\n')
      - name: Tag and publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          (cd artifacts && sha256sum *.whl > SHA256SUMS)
          printf '\nSource commit: %s\nValidation run: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "docs/releases/$RELEASE_VERSION.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_VERSION.md" \
            artifacts/*.whl artifacts/SHA256SUMS
