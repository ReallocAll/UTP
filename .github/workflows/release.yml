name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q src/endstone_utp

  wheel:
    name: Universal wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          wheel = wheels[0]
          assert wheel.name.endswith("-none-any.whl"), wheel.name

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "endstone_utp/__init__.py" in names, sorted(names)

              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, entry_points
              text = archive.read(entry_points[0]).decode("utf-8")
              assert "[endstone]" in text, text
              assert "utp = endstone_utp:Main" in text, text

          print(wheel)

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_utp-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
