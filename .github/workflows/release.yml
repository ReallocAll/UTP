name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src/endstone_utp

  wheel:
    name: Universal wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel
        shell: python
        run: |
          from email.parser import Parser
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          wheel = wheels[0]
          assert wheel.name.endswith("-none-any.whl"), wheel.name

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "endstone_utp/__init__.py" in names, sorted(names)

              metadata_files = [name for name in names if name.endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1, metadata_files
              metadata = Parser().parsestr(archive.read(metadata_files[0]).decode("utf-8"))
              assert metadata["Name"] == project["name"], metadata["Name"]
              assert metadata["Version"] == project["version"], metadata["Version"]
              assert set(metadata["Requires-Python"].split(",")) == {">=3.11", "<3.16"}, metadata["Requires-Python"]

              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, entry_points
              text = archive.read(entry_points[0]).decode("utf-8")
              assert "[endstone]" in text, text
              assert "utp = endstone_utp:Main" in text, text

          print(wheel)

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify release target
        id: release-target
        env:
          RELEASE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          sha = os.environ["RELEASE_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == sha
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          tag = os.environ["REF_NAME"]
          assert tag == f"v{project['version']}", (tag, project["version"])
          refs = subprocess.check_output(
              ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}", f"refs/tags/{tag}^{{}}"],
              text=True,
          )
          targets = {ref: commit for commit, ref in (line.split() for line in refs.splitlines())}
          if targets:
              target = targets.get(f"refs/tags/{tag}^{{}}", targets.get(f"refs/tags/{tag}"))
              assert target == sha, (tag, target, sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")

      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_utp-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-target.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
