[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-utp"
version = "260123.post1"
description = "A de-commanded teleportation collection plugin for EndstoneMC."
requires-python = ">=3.10"

[project.entry-points."endstone"]
utp = "endstone_utp:Main"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_utp"]
